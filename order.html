<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Замовлення | Green Farm</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tinos:wght@400;700&amp;display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="site-header">
  <div class="container">
    <a class="logo" href="index.html">Green Farm</a>
    <nav aria-label="Основна навігація">
      <ul>
        <li><a href="index.html">Головна</a></li>
        <li><a href="catalog.html">Продукція</a></li>
        <li><a href="cheese.html">Домашній сир</a></li>
        <li><a href="about.html">Про нас</a></li>
        <li><a href="order.html" aria-current="page">Замовлення</a></li>
        <li><a href="cabinet.html">Кабінет</a></li>
      </ul>
    </nav>
  </div>
</header>

<main class="container">
  <section class="text">
    <h1>Замовлення фермерської продукції</h1>

    <form id="orderForm" hidden>
      <label for="name">Ім'я:</label>
      <input type="text" id="name" name="name" readonly required minlength="2" placeholder="Введіть ваше ім'я">

      <label for="phone">Телефон:</label>
      <input type="tel" id="phone" name="phone" readonly required pattern="[0-9]{10,13}" placeholder="380XXXXXXXXX">

      <label for="email">Email:</label>
      <input type="email" id="email" name="email" readonly required placeholder="example@gmail.com">

      <label for="address">Адреса доставки:</label>
      <input type="text" id="address" name="address" required minlength="10" placeholder="Місто, вулиця, будинок, квартира">

      <label for="product">Оберіть продукцію:</label>
      <select id="product" name="product" required>
        <option value="">Завантаження…</option>
      </select>

      <label for="quantity">Кількість:</label>
      <input type="number" id="quantity" name="quantity" required min="1" max="100" value="1">

      <label for="date">Бажана дата отримання:</label>
      <input type="date" id="date" name="date" required>

      <label for="comment">Коментар:</label>
      <textarea id="comment" name="comment" rows="4" maxlength="300" placeholder="Додаткові побажання"></textarea>

      <button type="submit" id="submitBtn">Відправити замовлення</button>
    </form>

    <p id="message" role="status">Завантаження…</p>
  </section>
</main>

<footer class="site-footer">
  <div class="container">
    <p>© 2026 Green Farm. смт Зелене, вул. Центральна, 15</p>
    <p>+380 (67) 123-45-67 · info@greenfarm.ua · Пн–Сб, 08:00–18:00</p>
  </div>
</footer>

<script src="app.js"></script>
<script>
// Форма замовлення: профіль і товари отримуємо через fetch,
// саме замовлення відправляємо через fetch методом POST
const form = document.getElementById("orderForm");
const msg = document.getElementById("message");
const submitBtn = document.getElementById("submitBtn");

// 1. Якщо користувач не увійшов — показуємо посилання на вхід
if (!getToken()) {
    msg.innerHTML = 'Щоб зробити замовлення, <a href="register.html">увійдіть або зареєструйтесь</a>.';
} else {
    loadForm();
}

// 2. Завантажуємо профіль (GET /api/me) і товари (GET /api/products)
async function loadForm() {
    show(msg, "Завантаження даних…", "load");

    try {
        const meResponse = await fetch("/api/me", {
            headers: { "Authorization": "Bearer " + getToken() }
        });

        // токен прострочений або неправильний
        if (meResponse.status === 401) {
            localStorage.removeItem("token");
            location.href = "register.html";
            return;
        }
        if (!meResponse.ok) throw new Error("сервер відповів " + meResponse.status);
        const me = await meResponse.json();

        const productsResponse = await fetch("/api/products");
        if (!productsResponse.ok) throw new Error("сервер відповів " + productsResponse.status);
        const products = await productsResponse.json();

        document.getElementById("name").value = me.name;
        document.getElementById("phone").value = me.phone;
        document.getElementById("email").value = me.email;

        document.getElementById("product").innerHTML =
            '<option value="">-- Оберіть товар --</option>' +
            products.map(function (p) {
                return '<option value="' + p.product_id + '">' + esc(p.name) + ' — ' + esc(p.price) + ' грн</option>';
            }).join("");

        document.getElementById("date").min = today();
        show(msg, "", "load");
        form.hidden = false;
    } catch (e) {
        show(msg, "Не вдалося завантажити дані: " + e.message, "err");
        const btn = document.createElement("button");
        btn.type = "button";
        btn.textContent = "Спробувати ще раз";
        btn.onclick = loadForm;
        msg.appendChild(btn);
    }
}

// 3. Відправка замовлення (POST /api/orders)
form.addEventListener("submit", async function (event) {
    event.preventDefault();
    if (!form.checkValidity()) return form.reportValidity();

    // блокуємо кнопку, щоб не відправити замовлення двічі
    submitBtn.disabled = true;
    submitBtn.textContent = "Відправляємо…";
    show(msg, "Відправляємо замовлення…", "load");

    try {
        const response = await fetch("/api/orders", {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
                "Authorization": "Bearer " + getToken()
            },
            body: JSON.stringify({
                product_id: Number(document.getElementById("product").value),
                quantity: Number(document.getElementById("quantity").value),
                address: document.getElementById("address").value,
                delivery_date: document.getElementById("date").value,
                comment: document.getElementById("comment").value
            })
        });

        const data = await response.json();
        // сервер повертає { error: "..." } — показуємо цей текст користувачу
        if (!response.ok) throw new Error(data.error || ("сервер відповів " + response.status));

        show(msg, "Дякуємо! Замовлення №" + data.id + " прийнято. Переглянути його можна в кабінеті.", "ok");
        document.getElementById("address").value = "";
        document.getElementById("comment").value = "";
        document.getElementById("product").value = "";
    } catch (e) {
        show(msg, "Помилка: " + e.message, "err");
    } finally {
        // у будь-якому разі повертаємо кнопку в робочий стан
        submitBtn.disabled = false;
        submitBtn.textContent = "Відправити замовлення";
    }
});
</script>
</body>
</html>
