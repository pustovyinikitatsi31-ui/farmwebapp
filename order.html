<head>
<meta charset="UTF-8">

<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="site-header">
  <div class="container">
    <a class="logo" href="index.html">Green Farm</a>
    <nav aria-label="Основна навігація">
      <ul>
        <li><a href="index.html">Головна</a></li>
        <li><a href="catalog.html">Продукція</a></li>
        <li><a href="cheese.html">Домашній сир</a></li>
        <li><a href="about.html">Про нас</a></li>
        <li><a href="order.html">Замовлення</a></li>
      </ul>
    </nav>
  </div>
</header>
<main class="container">
<section class="text"><h1>Замовлення фермерської продукції</h1><form id="orderForm">

    <label for="name">Ім'я:</label>
    <input
        type="text"
        id="name"
        name="name"
        required
        minlength="2"
        placeholder="Введіть ваше ім'я">

    <label for="phone">Телефон:</label>
    <input
        type="tel"
        id="phone"
        name="phone"
        required
        pattern="[0-9]{10,13}"
        placeholder="380XXXXXXXXX">

    <label for="email">Email:</label>
    <input
        type="email"
        id="email"
        name="email"
        required
        placeholder="example@gmail.com">
      <label for="address">Адреса доставки:</label>
<input
    type="text"
    id="address"
    name="address"
    required
    minlength="10"
    placeholder="Місто, вулиця, будинок, квартира">

    <label for="product">Оберіть продукцію:</label>
    <select id="product" name="product" required>
        <option value="">-- Оберіть товар --</option>
        <option>Овочі</option>
        <option>Фрукти</option>
        <option>Молоко</option>
        <option>Яйця</option>
        <option>Мед</option>
    </select>

    <label for="quantity">Кількість:</label>
    <input
        type="number"
        id="quantity"
        name="quantity"
        required
        min="1"
        max="100">

    <label for="date">Бажана дата отримання:</label>
    <input
        type="date"
        id="date"
        name="date"
        required>

    <label for="comment">Коментар:</label>
    <textarea
        id="comment"
        name="comment"
        rows="4"
        maxlength="300"
        placeholder="Додаткові побажання "></textarea>

    <button type="submit">Відправити замовлення</button>

</form><p id="message" role="status"></p></section><script>
document.getElementById("orderForm").addEventListener("submit", function(event) {
    event.preventDefault();

    if (this.checkValidity()) {

        document.getElementById("message").textContent =
        "Дякуємо за замовлення! Ми зв'яжемося з вами по телефону та електронній пошті для уточнення деталей замовлення.";

        this.reset();
    } else {
        this.reportValidity();
    }
});
</script>
</main>

</html>
