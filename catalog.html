<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Каталог продукції | Green Farm</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tinos:wght@400;700&amp;display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="site-header">
  <div class="container">
    <a class="logo" href="index.html">Green Farm</a>
    <nav aria-label="Основна навігація">
      <ul>
        <li><a href="index.html">Головна</a></li>
        <li><a href="catalog.html" aria-current="page">Продукція</a></li>
        <li><a href="cheese.html">Домашній сир</a></li>
        <li><a href="about.html">Про нас</a></li>
        <li><a href="order.html">Замовлення</a></li>
        <li><a href="cabinet.html">Кабінет</a></li>
      </ul>
    </nav>
  </div>
</header>

<main class="container">
  <h1>Каталог продукції ферми Green Farm</h1>
  <div class="grid" id="catalog"></div>
  <p id="message" role="status">Завантаження…</p>
  <p class="back"><a href="index.html">← Повернутися на головну</a></p>
</main>

<footer class="site-footer">
  <div class="container">
    <p>© 2026 Green Farm. смт Зелене, вул. Центральна, 15</p>
    <p>+380 (67) 123-45-67 · info@greenfarm.ua · Пн–Сб, 08:00–18:00</p>
  </div>
</footer>

<script src="app.js"></script>
<script>
// Каталог: усі товари з GET /api/products
const catalog = document.getElementById("catalog");
const msg = document.getElementById("message");

async function loadCatalog() {
    // стан завантаження
    catalog.innerHTML = "";
    show(msg, "Завантаження…", "load");
    try {
        const response = await fetch("/api/products");
        if (!response.ok) throw new Error("сервер відповів " + response.status);
        const products = await response.json();

        // порожній результат
        if (products.length === 0) {
            show(msg, "У каталозі поки немає товарів.", "load");
            return;
        }
        catalog.innerHTML = products.map(function (p) {
            return '<article class="card">' +
                '<img src="' + esc(p.image) + '" alt="' + esc(p.name) + '" width="400" height="300" loading="lazy">' +
                '<h2>' + esc(p.name) + '</h2>' +
                '<p>' + esc(p.description) + '</p>' +
                '<p><strong>' + esc(p.price) + ' грн</strong></p>' +
                (p.name === "Домашній сир" ? '<a class="btn btn-light" href="cheese.html">Детальніше</a>' : '') +
                '</article>';
        }).join("");
        show(msg, "", "load");
    } catch (e) {
        // стан помилки
        const text = e instanceof TypeError ? "Немає зв'язку з сервером" : "Не вдалося завантажити каталог: " + e.message;
        show(msg, text + " ", "err");
        const btn = document.createElement("button");
        btn.type = "button";
        btn.textContent = "Спробувати ще раз";
        btn.onclick = loadCatalog;
        msg.appendChild(btn);
    }
}
loadCatalog();
</script>
</body>
</html>
