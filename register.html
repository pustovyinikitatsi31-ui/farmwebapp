<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Реєстрація | Green Farm</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tinos:wght@400;700&amp;display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="site-header">
  <div class="container">
    <a class="logo" href="index.html">Green Farm</a>
    <nav aria-label="Основна навігація">
      <ul>
        <li><a href="index.html">Головна</a></li>
        <li><a href="catalog.html">Продукція</a></li>
        <li><a href="cheese.html">Домашній сир</a></li>
        <li><a href="about.html">Про нас</a></li>
        <li><a href="order.html">Замовлення</a></li>
        <li><a href="register.html" aria-current="page">Реєстрація</a></li>
      </ul>
    </nav>
  </div>
</header>

<main class="container">
  <section class="text">
    <h1>Реєстрація</h1>

    <form id="regForm" action="#" method="post">
      <label for="name">Ім'я:</label>
      <input type="text" id="name" name="name" required minlength="2" placeholder="Ваше ім'я">

      <label for="email">Email:</label>
      <input type="email" id="email" name="email" required placeholder="example@gmail.com">

      <label for="phone">Телефон:</label>
      <input type="tel" id="phone" name="phone" required pattern="[0-9]{10,13}" placeholder="380XXXXXXXXX">

      <label for="password">Пароль (мінімум 6 символів):</label>
      <input type="password" id="password" name="password" required minlength="6">

      <button type="submit">Зареєструватися</button>
    </form>
    <p id="regMsg" role="status"></p>
  </section>
</main>

<footer class="site-footer">
  <div class="container">
    <p>© 2026 Green Farm. смт Зелене, вул. Центральна, 15</p>
    <p>+380 (67) 123-45-67 · info@greenfarm.ua · Пн–Сб, 08:00–18:00</p>
  </div>
</footer>

<script>
// Лише демонстрація: без сервера показуємо підтвердження після успішної валідації
document.getElementById("regForm").addEventListener("submit", function (e) {
  e.preventDefault();
  document.getElementById("regMsg").textContent = "Реєстрація успішна!";
  this.reset();
});
</script>
</body>
</html>
