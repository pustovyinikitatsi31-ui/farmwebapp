<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Реєстрація | Green Farm</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tinos:wght@400;700&amp;display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="site-header">
  <div class="container">
    <a class="logo" href="index.html">Green Farm</a>
    <nav aria-label="Основна навігація">
      <ul>
        <li><a href="index.html">Головна</a></li>
        <li><a href="catalog.html">Продукція</a></li>
        <li><a href="cheese.html">Домашній сир</a></li>
        <li><a href="about.html">Про нас</a></li>
        <li><a href="order.html">Замовлення</a></li>
        <li><a href="cabinet.html">Кабінет</a></li>
      </ul>
    </nav>
  </div>
</header>

<main class="container">
  <section class="text">
    <h1>Реєстрація</h1>

    <form id="regForm">
      <label for="name">Ім'я:</label>
      <input type="text" id="name" name="name" required minlength="2" placeholder="Ваше ім'я">

      <label for="email">Email:</label>
      <input type="email" id="email" name="email" required placeholder="example@gmail.com">

      <label for="phone">Телефон:</label>
      <input type="tel" id="phone" name="phone" required pattern="[0-9]{10,13}" placeholder="380XXXXXXXXX">

      <label for="password">Пароль (мінімум 6 символів):</label>
      <input type="password" id="password" name="password" required minlength="6">

      <button type="submit">Зареєструватися</button>
    </form>
    <p id="regMsg" role="status"></p>

    <h2>Вже є акаунт? Вхід</h2>

    <form id="loginForm">
      <label for="lemail">Email:</label>
      <input type="email" id="lemail" name="email" required>

      <label for="lpassword">Пароль:</label>
      <input type="password" id="lpassword" name="password" required>

      <button type="submit">Увійти</button>
    </form>
    <p id="loginMsg" role="status"></p>
  </section>
</main>

<footer class="site-footer">
  <div class="container">
    <p>© 2026 Green Farm. смт Зелене, вул. Центральна, 15</p>
    <p>+380 (67) 123-45-67 · info@greenfarm.ua · Пн–Сб, 08:00–18:00</p>
  </div>
</footer>

<script src="app.js"></script>
<script>
// Реєстрація та вхід: дані відправляються через fetch (POST), токен зберігається в localStorage
if (getToken()) location.href = "cabinet.html";

const regForm = document.getElementById("regForm");
const loginForm = document.getElementById("loginForm");

// 1. Реєстрація — POST /api/register
regForm.addEventListener("submit", async function (e) {
    e.preventDefault();
    if (!regForm.checkValidity()) return regForm.reportValidity();

    const btn = regForm.querySelector("button");
    const regMsg = document.getElementById("regMsg");

    show(regMsg, "Відправляємо…", "load");
    btn.disabled = true;                 // щоб не натиснули двічі
    btn.textContent = "Зачекайте…";

    try {
        const response = await fetch("/api/register", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(Object.fromEntries(new FormData(regForm)))
        });

        const data = await response.json();
        // показуємо повідомлення сервера: "Такий email уже зареєстровано", "Пароль: мінімум 6 символів" тощо
        if (!response.ok) throw new Error(data.error || ("сервер відповів " + response.status));

        setToken(data.token);
        show(regMsg, "Реєстрація успішна!", "ok");
        setTimeout(function () { location.href = "cabinet.html"; }, 500);
    } catch (err) {
        show(regMsg, err.message, "err");
        btn.disabled = false;
        btn.textContent = "Зареєструватися";
    }
});

// 2. Вхід — POST /api/login
loginForm.addEventListener("submit", async function (e) {
    e.preventDefault();
    if (!loginForm.checkValidity()) return loginForm.reportValidity();

    const btn = loginForm.querySelector("button");
    const loginMsg = document.getElementById("loginMsg");

    show(loginMsg, "Відправляємо…", "load");
    btn.disabled = true;
    btn.textContent = "Зачекайте…";

    try {
        const response = await fetch("/api/login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(Object.fromEntries(new FormData(loginForm)))
        });

        const data = await response.json();
        if (!response.ok) throw new Error(data.error || ("сервер відповів " + response.status));

        setToken(data.token);
        show(loginMsg, "Вхід виконано!", "ok");
        setTimeout(function () { location.href = "cabinet.html"; }, 500);
    } catch (err) {
        show(loginMsg, err.message, "err");
        btn.disabled = false;
        btn.textContent = "Увійти";
    }
});
</script>
</body>
</html>
